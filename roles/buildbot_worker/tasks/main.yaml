---
#
# Install and update buildbot workers.
#

- name: "Buildbot worker variable checks."
  assert:
    that:
      - buildbot_project is defined
      - buildbot_master_host is defined
      - buildbot_master_port is defined
      - buildbot_worker_name is defined
      - buildbot_worker_admin is defined
      - buildbot_worker_password is defined
      - buildbot_worker_password | length > 0

- debug: var=ansible_distribution_version
- debug: var=ansible_distribution_major_version
- debug: var=ansible_distribution
- debug: var=ansible_os_family

- name: "Set OS specific variables"
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}.yaml"
        - "{{ ansible_os_family | replace(' ', '_') }}.yaml"
        - "defaults.yaml"
      paths:
        - "{{ role_path }}/vars"

- name: "Stage 1: Install buildbot-worker package."
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}.yaml"
        - "{{ ansible_os_family | replace(' ', '_') }}.yaml"
        - "default.yaml"
      paths:
        - "{{ role_path }}/tasks/install"

- name: "Stage 2: Create buildbot user account."
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}.yaml"
        - "{{ ansible_os_family | replace(' ', '_') }}.yaml"
        - "default.yaml"
      paths:
        - "{{ role_path }}/tasks/user"

- name: "Stage 3: Configure buildbot-worker instance."
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}.yaml"
        - "{{ ansible_os_family | replace(' ', '_') }}.yaml"
        - "default.yaml"
      paths:
        - "{{ role_path }}/tasks/setup"

- name: "Stage 4: Setup buildbot-worker service."
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}-{{ ansible_distribution_major_version }}.yaml"
        - "{{ ansible_distribution | replace(' ', '_') }}.yaml"
        - "{{ ansible_os_family | replace(' ', '_') }}.yaml"
        - "default.yaml"
      paths:
        - "{{ role_path }}/tasks/service"
