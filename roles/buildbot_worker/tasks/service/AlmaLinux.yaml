---
- name: "AlmaLinux: Install buildbot worker systemd unit file"
  become: yes
  template:
    src: buildbot-worker.service.j2
    dest: /etc/systemd/system/buildbot-worker.service
    owner: root
    group: root
    mode: 0644
  register: buildbot_worker_unit_file_results
  notify: "Restart buildbot-worker"

- name: "AlmaLinux: Start buildbot worker service"
  become: yes
  systemd:
    name: "{{ buildbot_worker_service }}"
    daemon_reload: yes
    enabled: yes
    state: started
  when: not buildbot_worker_unit_file_results.changed
