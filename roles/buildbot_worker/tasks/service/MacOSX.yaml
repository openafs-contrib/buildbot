---
- name: "MacOSX: Install launch daemon configuration file"
  become: true
  template:
    src: net.buildbot.worker.plist.j2
    dest: /Library/LaunchDaemons/net.buildbot.worker.plist
    owner: root
    group: wheel
    mode: "0644"
  notify: "Restart buildbot-worker"
  tags: root

- name: "MacOSX: Check buildbot worker launch daemon"
  become: true
  command: launchctl print system/net.buildbot.worker
  register: buildbot_worker_launchd_print
  changed_when: false
  failed_when: false
  tags: root

- name: "MacOSX: Launch buildbot worker"
  become: true
  command: launchctl bootstrap system /Library/LaunchDaemons/net.buildbot.worker.plist
  when: buildbot_worker_launchd_print.rc != 0
  tags: root
