---
- name: "openSUSE: Update buildbot-worker systemd unit file."
  become: yes
  ansible.builtin.template:
    src: buildbot-worker.service.j2
    dest: /etc/systemd/system/buildbot-worker.service
    owner: root
    group: root
    mode: 0644
  register: buildbot_worker_unit_file_results
  notify: "Restart buildbot-worker"

- name: "openSUSE: Ensure the buildbot-worker service is running."
  # The handler will start the service when the unit file was changed.
  # This task is skipped when the unit file is changed to avoid a
  # double startup bounce.
  become: yes
  ansible.builtin.systemd:
    name: "{{ buildbot_worker_service }}"
    enabled: yes
    state: started
  when: not buildbot_worker_unit_file_results.changed
