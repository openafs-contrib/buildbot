---
- name: "Windows: Create buildbot worker."
  vars:
    buildbot_worker_bin: "{{ buildbot_worker_python | dirname }}/Scripts/buildbot-worker.exe"
  ansible.windows.win_command: >
    "{{ buildbot_worker_bin }}" create-worker "{{ buildbot_worker_basedir }}"
    {{ buildbot_master_host }}:{{ buildbot_master_port }}
    {{ buildbot_worker_name }} {{ buildbot_worker_password }}
  register: create_worker_results
  changed_when: '"buildbot.tac already exists and is correct" not in create_worker_results.stdout | d("")'
  notify: "Restart buildbot-worker"

- name: "Windows: Create buildbot worker info directory."
  ansible.windows.win_file:
    path: "{{ buildbot_worker_basedir }}/info"
    state: directory

- name: "Windows: Update buildbot worker info files."
  ansible.windows.win_template:
    src: "info-{{ info_item }}.j2"
    dest: "{{ buildbot_worker_basedir }}/info/{{ info_item }}"
  loop:
    - "host"
    - "admin"
    - "access_uri"
  loop_control:
    loop_var: info_item
  notify: "Restart buildbot-worker"
