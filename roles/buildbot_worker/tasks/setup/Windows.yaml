---
- name: "Windows: Create buildbot base directory."
  ansible.windows.win_file:
    path: "{{ buildbot_worker_basedir }}"
    state: directory

- name: "Windows: Create buildbot worker configuration."
  ansible.windows.win_template:
    src: windows-buildbot.tac.j2
    dest: "{{ buildbot_worker_basedir }}/buildbot.tac"
    newline_sequence: "\r\n"
  notify: "Restart buildbot-worker"

- name: "Windows: Create buildbot worker info directory."
  ansible.windows.win_file:
    path: "{{ buildbot_worker_basedir }}/info"
    state: directory

- name: "Windows: Update buildbot worker info files."
  ansible.windows.win_template:
    src: "info-{{ info_item }}.j2"
    dest: "{{ buildbot_worker_basedir }}/info/{{ info_item }}"
  loop:
    - "host"
    - "admin"
    - "access_uri"
  loop_control:
    loop_var: info_item
  notify: "Restart buildbot-worker"
